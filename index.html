<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="어머니암송">
    <title>어머님의 말씀 암송 노트</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root { --base-size: 24px; }
        body { 
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            font-size: var(--base-size); 
            text-align: center; 
            padding: 20px; 
            background-color: #fff0f5; /* 어머님을 위해 배경색을 따뜻한 핑크빛으로 살짝 바꿨습니다 */
            margin: 0;
            user-select: none;
        }
        
        .screen { display: none; }
        .screen.active { display: block; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .controls span { font-weight: bold; color: #555; font-size: 0.9em; }
        .btn-control { 
            font-size: 0.8em; font-weight: bold; padding: 8px 15px; 
            background-color: #fff; border: 2px solid #ccc; border-radius: 8px; cursor: pointer; 
        }
        .btn-control:active { background-color: #eee; }
        .btn-back { background-color: #34495e; color: white; border: none; font-size: 0.9em; padding: 10px 20px; border-radius: 10px; font-weight: bold; }

        .menu-title { font-weight: bold; font-size: 1.4em; color: #2c3e50; margin-bottom: 15px; }
        
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-mode {
            flex: 1; padding: 15px 0; font-size: 1.05em; font-weight: bold; 
            border-radius: 12px; border: none; cursor: pointer;
            background-color: #fce4ec; color: #7f8c8d; transition: all 0.2s;
        }
        .btn-mode.active { 
            background-color: #e83e8c; color: white; /* 탭 활성화 색상 변경 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
        }

        .verse-list { display: flex; flex-direction: column; gap: 15px; }
        
        .verse-item {
            background-color: white; border-radius: 15px; padding: 20px;
            font-size: 1.1em; font-weight: bold; color: #c2185b; /* 글씨 색상 변경 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; border: none;
            transition: transform 0.1s; text-align: center; line-height: 1.4;
        }
        .verse-item:active { transform: scale(0.98); background-color: #f0f0f0; }

        .read-item {
            background-color: white; border-radius: 15px; padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: left;
        }
        .read-title { font-size: 1.05em; font-weight: bold; color: #e67e22; margin-bottom: 10px; border-bottom: 2px solid #f9e79f; padding-bottom: 8px;}
        .read-text { font-size: 1.1em; color: #333; line-height: 1.6; font-weight: bold; word-break: keep-all;}

        .game-title { font-weight: bold; font-size: 1.3em; margin-bottom: 15px; color: #2c3e50; line-height: 1.4; }
        
        .btn-hint {
            font-size: 0.8em; padding: 10px 20px; background-color: #9b59b6;
            color: white; border: none; border-radius: 10px; cursor: pointer;
            font-weight: bold; margin-bottom: 20px; box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }
        .btn-hint:active { transform: scale(0.95); }
        .hint-box {
            display: none; background-color: #fff3cd; color: #856404;
            padding: 15px; border-radius: 10px; margin-bottom: 25px;
            font-weight: bold; font-size: 1.1em; line-height: 1.5; border: 2px dashed #ffeeba; word-break: keep-all;
        }

        .target-area { 
            min-height: 120px; border: 3px dashed #bdc3c7; border-radius: 15px; 
            padding: 20px; margin-bottom: 30px; background-color: white; 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center;
        }
        .pool-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

        button.word-btn, button.target-btn { 
            font-size: 1em; font-weight: bold; padding: 12px 20px; 
            border-radius: 12px; border: none; cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s;
        }
        button.word-btn:active, button.target-btn:active { transform: scale(0.95); }
        .word-btn { background-color: #27ae60; color: white; }
        .target-btn { background-color: #e83e8c; color: white; }

        .message { font-size: 1.3em; color: #e74c3c; font-weight: bold; margin-top: 20px; display: none; line-height: 1.5;}
        .restart-btn { 
            font-size: 0.9em; padding: 12px 25px; background-color: #f39c12; 
            color: white; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen active">
        <div class="header">
            <div class="controls">
                <button class="btn-control" onclick="changeSize(2)">글씨 ＋</button>
                <button class="btn-control" onclick="changeSize(-2)">글씨 －</button>
            </div>
        </div>
        <div class="menu-title">📖 어머니의 암송 노트</div>
        
        <div class="mode-tabs">
            <button class="btn-mode active" id="btn-tab-game" onclick="setMode('game')">🧩 암송 게임</button>
            <button class="btn-mode" id="btn-tab-read" onclick="setMode('read')">📖 전체 읽기</button>
        </div>

        <div class="verse-list" id="game-list"></div>
        <div class="verse-list" id="read-list" style="display: none;"></div>
    </div>

    <div id="game-screen" class="screen">
        <div class="header">
            <button class="btn-control btn-back" onclick="showMenu()">◀ 목록으로</button>
            <div class="controls">
                <button class="btn-control" onclick="changeSize(2)">글씨 ＋</button>
                <button class="btn-control" onclick="changeSize(-2)">글씨 －</button>
            </div>
        </div>
        
        <div class="game-title" id="game-title">말씀 제목</div>
        
        <button class="btn-hint" onclick="toggleHint()">👀 힌트 보기</button>
        <div id="hint-box" class="hint-box"></div>

        <div class="target-area" id="target"></div>
        <div class="pool-area" id="pool"></div>

        <div class="message" id="message">
            🎉 아멘! 참 잘하셨습니다! 🎉<br>
            <button class="restart-btn" onclick="initGame()">다시 하기 ↻</button>
        </div>
    </div>

    <script>
        // 💡 요한일서 4장 15절 ~ 21절 말씀 데이터베이스
        const verseDatabase = [
            { title: "요한일서 4:15", words: ["누구든지 예수를", "하나님의 아들이라 시인하면", "하나님이 그의 안에 거하시고", "그도 하나님 안에 거하느니라"] },
            { title: "요한일서 4:16", words: ["하나님이 우리를 사랑하시는 사랑을", "우리가 알고 믿었노니", "하나님은 사랑이시라", "사랑 안에 거하는 자는", "하나님 안에 거하고", "하나님도 그의 안에 거하시느니라"] },
            { title: "요한일서 4:17", words: ["이로써 사랑이", "우리에게 온전히 이루어진 것은", "우리로 심판 날에", "담대함을 가지게 하려 함이니", "주께서 그러하심과 같이", "우리도 이 세상에서 그러하니라"] },
            { title: "요한일서 4:18", words: ["사랑 안에 두려움이 없고", "온전한 사랑이 두려움을 내쫓나니", "두려움에는 형벌이 있음이라", "두려워하는 자는", "사랑 안에서 온전히 이루지 못하였느니라"] },
            { title: "요한일서 4:19", words: ["우리가 사랑함은", "그가 먼저", "우리를 사랑하셨음이라"] },
            { title: "요한일서 4:20", words: ["누구든지 하나님을 사랑하노라 하고", "그 형제를 미워하면", "이는 거짓말하는 자니", "보는 바 그 형제를 사랑하지 아니하는 자는", "보지 못하는 바 하나님을", "사랑할 수 없느니라"] },
            { title: "요한일서 4:21", words: ["우리가 이 계명을", "주께 받았나니", "하나님을 사랑하는 자는", "또한 그 형제를", "사랑할지니라"] }
        ];

        let currentSize = 24; 
        let currentVerseIndex = 0;
        let correctOrder = [];
        let currentWords = [];
        let poolWords = [];
        let hintTimer; 

        function changeSize(delta) {
            currentSize += delta;
            if (currentSize < 16) currentSize = 16; 
            if (currentSize > 40) currentSize = 40; 
            document.documentElement.style.setProperty('--base-size', currentSize + 'px');
        }

        function setMode(mode) {
            if(mode === 'game') {
                document.getElementById('game-list').style.display = 'flex';
                document.getElementById('read-list').style.display = 'none';
                document.getElementById('btn-tab-game').classList.add('active');
                document.getElementById('btn-tab-read').classList.remove('active');
            } else {
                document.getElementById('game-list').style.display = 'none';
                document.getElementById('read-list').style.display = 'flex';
                document.getElementById('btn-tab-game').classList.remove('active');
                document.getElementById('btn-tab-read').classList.add('active');
            }
        }

        function buildMenu() {
            const gameListDiv = document.getElementById('game-list');
            const readListDiv = document.getElementById('read-list');
            gameListDiv.innerHTML = '';
            readListDiv.innerHTML = '';

            verseDatabase.forEach((verse, index) => {
                const gameBtn = document.createElement('button');
                gameBtn.className = 'verse-item';
                gameBtn.innerText = verse.title;
                gameBtn.onclick = () => openGame(index);
                gameListDiv.appendChild(gameBtn);

                const readItem = document.createElement('div');
                readItem.className = 'read-item';
                readItem.innerHTML = `<div class="read-title">${verse.title}</div><div class="read-text">${verse.words.join(" ")}</div>`;
                readListDiv.appendChild(readItem);
            });
        }

        function showMenu() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
        }

        function openGame(index) {
            currentVerseIndex = index;
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('game-title').innerText = "📖 " + verseDatabase[index].title;
            correctOrder = verseDatabase[index].words;
            initGame();
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initGame() {
            currentWords = [];
            poolWords = shuffle([...correctOrder]);
            document.getElementById('message').style.display = 'none';
            document.getElementById('hint-box').style.display = 'none';
            
            if (hintTimer) clearTimeout(hintTimer); 
            
            render();
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            
            if (hintTimer) clearTimeout(hintTimer);

            if (hintBox.style.display === 'block') {
                hintBox.style.display = 'none';
            } else {
                hintBox.innerText = correctOrder.join(" ");
                hintBox.style.display = 'block';
                
                // 💡 5초 타이머 설정 유지
                hintTimer = setTimeout(() => {
                    hintBox.style.display = 'none';
                }, 5000);
            }
        }

        function moveToTarget(word, index) {
            poolWords.splice(index, 1);
            currentWords.push(word);
            render();
            checkWin();
        }

        function moveToPool(word, index) {
            currentWords.splice(index, 1);
            poolWords.push(word);
            render();
        }

        function render() {
            const targetDiv = document.getElementById('target');
            const poolDiv = document.getElementById('pool');
            
            targetDiv.innerHTML = '';
            poolDiv.innerHTML = '';

            if(currentWords.length === 0) {
                targetDiv.innerHTML = '<span style="color:#999; font-size: 0.8em;">아래 말씀 조각을 순서대로 눌러보세요</span>';
            } else {
                currentWords.forEach((word, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'target-btn';
                    btn.innerText = word;
                    btn.onclick = () => moveToPool(word, index);
                    targetDiv.appendChild(btn);
                });
            }

            poolWords.forEach((word, index) => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.innerText = word;
                btn.onclick = () => moveToTarget(word, index);
                poolDiv.appendChild(btn);
            });
        }

        function playSuccessSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return; 
            const ctx = new AudioContext();
            const notes = [659.25, 830.61, 987.77]; 
            let startTime = ctx.currentTime;

            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.type = 'sine'; 
                osc.frequency.value = freq;
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                osc.start(startTime + i * 0.15); 
                gainNode.gain.setValueAtTime(0.5, startTime + i * 0.15);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + i * 0.15 + 0.5);
                osc.stop(startTime + i * 0.15 + 0.5);
            });
        }

        function checkWin() {
            if (currentWords.length === correctOrder.length) {
                let isWin = true;
                for (let i = 0; i < correctOrder.length; i++) {
                    if (currentWords[i] !== correctOrder[i]) isWin = false;
                }
                if (isWin) {
                    document.getElementById('message').style.display = 'block';
                    document.getElementById('pool').innerHTML = ''; 
                    playSuccessSound();
                }
            }
        }

        buildMenu();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
